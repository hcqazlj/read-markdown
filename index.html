<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Editor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #fafbfc;
  --bg-deep: #f0f2f5;
  --bg-card: #ffffff;
  --bg-elevated: #ffffff;
  --border: rgba(0,0,0,0.08);
  --border-strong: rgba(0,0,0,0.15);
  --text: #0f172a;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --accent: #6366f1;
  --accent-soft: rgba(99,102,241,0.08);
  --accent-hover: #4f46e5;
  --accent-glow: rgba(99,102,241,0.15);
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
  --glass: rgba(255,255,255,0.7);
  --glass-border: rgba(255,255,255,0.3);
}

[data-theme="dark"] {
  --bg: #0c0e14;
  --bg-deep: #111318;
  --bg-card: #16181f;
  --bg-elevated: #1c1e27;
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.12);
  --text: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #475569;
  --accent: #818cf8;
  --accent-soft: rgba(129,140,248,0.1);
  --accent-hover: #a5b4fc;
  --accent-glow: rgba(129,140,248,0.12);
  --glass: rgba(22,24,31,0.8);
  --glass-border: rgba(255,255,255,0.06);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ========== WELCOME ========== */
.welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  gap: 32px;
  padding: 40px;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}

.welcome::before {
  content: '';
  position: absolute;
  width: 600px; height: 600px;
  background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
  top: -200px; right: -100px;
  pointer-events: none;
}

.welcome::after {
  content: '';
  position: absolute;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(16,185,129,0.06) 0%, transparent 70%);
  bottom: -200px; left: -100px;
  pointer-events: none;
}

.welcome-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
  z-index: 1;
}

.welcome-logo .icon {
  width: 48px; height: 48px;
  background: linear-gradient(135deg, var(--accent) 0%, #a78bfa 100%);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px var(--accent-glow);
}

.welcome-logo .icon svg { width: 26px; height: 26px; color: white; }

.welcome h1 {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.welcome-subtitle {
  color: var(--text-secondary);
  font-size: 14px;
  max-width: 380px;
  text-align: center;
  line-height: 1.7;
  position: relative;
  z-index: 1;
}

.drop-zone {
  width: 460px;
  max-width: 90vw;
  height: 180px;
  border: 1.5px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  cursor: pointer;
  transition: all var(--transition);
  background: var(--bg-card);
  position: relative;
  z-index: 1;
}

.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 4px var(--accent-glow);
}

.drop-zone .drop-icon {
  width: 52px; height: 52px;
  background: var(--accent-soft);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
  transition: all var(--transition);
}

.drop-zone:hover .drop-icon { transform: translateY(-2px); }

.drop-zone span {
  color: var(--text-secondary);
  font-size: 13px;
}

.drop-zone .accent { color: var(--accent); font-weight: 500; }

.welcome-actions {
  display: flex;
  gap: 10px;
  position: relative;
  z-index: 1;
}

/* ========== BUTTONS ========== */
.btn {
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: all var(--transition);
  font-family: var(--font);
  white-space: nowrap;
}

.btn:hover {
  background: var(--bg-elevated);
  border-color: var(--border-strong);
  box-shadow: var(--shadow-sm);
}

.btn:active { transform: scale(0.97); }

.btn-primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  box-shadow: 0 2px 8px var(--accent-glow);
}

.btn-primary:hover {
  background: var(--accent-hover);
  box-shadow: 0 4px 16px var(--accent-glow);
}

.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--text-secondary);
}

.btn-ghost:hover {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: transparent;
}

.btn svg { width: 15px; height: 15px; flex-shrink: 0; }

/* ========== HEADER ========== */
.header {
  display: none;
  align-items: center;
  padding: 0 16px;
  height: 50px;
  border-bottom: 1px solid var(--border);
  background: var(--glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  gap: 6px;
  flex-shrink: 0;
  position: relative;
  z-index: 20;
}

.header.active { display: flex; }

.header-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-right: 16px;
}

.header-brand .icon {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, var(--accent), #a78bfa);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}

.header-brand .icon svg { width: 15px; height: 15px; color: white; }

.filename {
  font-size: 13px;
  font-weight: 600;
  margin-right: auto;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
}

.filename::before {
  content: '';
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--success);
  margin-right: 8px;
  vertical-align: middle;
}

.header .btn { padding: 6px 12px; font-size: 12px; }

.separator {
  width: 1px;
  height: 20px;
  background: var(--border);
  margin: 0 4px;
}

/* ========== TOOLBAR ========== */
.toolbar {
  display: none;
  align-items: center;
  padding: 3px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-card);
  gap: 1px;
  flex-shrink: 0;
}

.toolbar.active { display: flex; }

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 1px;
  padding: 2px;
  background: var(--bg-deep);
  border-radius: var(--radius-sm);
  margin: 0 3px;
}

.toolbar-btn {
  width: 30px;
  height: 28px;
  border: none;
  background: transparent;
  border-radius: 5px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  transition: all 0.12s;
  font-size: 13px;
  font-family: var(--font);
  font-weight: 600;
  position: relative;
}

.toolbar-btn:hover {
  background: var(--bg-card);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}

.toolbar-btn.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 1px 4px var(--accent-glow);
}

.toolbar-btn svg { width: 15px; height: 15px; }

.toolbar-btn[title]::after {
  content: attr(title);
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: var(--bg);
  padding: 3px 8px;
  border-radius: 5px;
  font-size: 11px;
  font-weight: 400;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s;
  z-index: 50;
}

.toolbar-btn:hover[title]::after { opacity: 1; }

.view-modes {
  display: flex;
  gap: 1px;
  margin-left: auto;
  background: var(--bg-deep);
  border-radius: var(--radius-sm);
  padding: 2px;
}

/* ========== EDITOR AREA ========== */
.editor-area {
  display: none;
  flex: 1;
  overflow: hidden;
}

.editor-area.active { display: flex; }

.pane {
  flex: 1;
  overflow: auto;
  position: relative;
  display: flex;
  flex-direction: column;
}

.pane-header {
  position: sticky;
  top: 0;
  z-index: 5;
  padding: 7px 20px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-muted);
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.pane-header::before {
  content: '';
  width: 3px; height: 3px;
  border-radius: 50%;
  background: var(--accent);
}

.divider {
  width: 1px;
  background: var(--border);
  cursor: col-resize;
  flex-shrink: 0;
  transition: all var(--transition);
  position: relative;
}

.divider::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  left: -3px; right: -3px;
  z-index: 10;
}

.divider:hover, .divider.dragging {
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent-glow);
}

/* ========== PREVIEW ========== */
.preview-scroll {
  flex: 1;
  overflow: auto;
}

.preview-content {
  padding: 32px 40px 80px;
  max-width: 900px;
  line-height: 1.8;
  font-size: 15px;
  margin: 0 auto;
}

.preview-content h1 {
  font-size: 2em;
  font-weight: 700;
  margin: 32px 0 16px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--border);
  letter-spacing: -0.5px;
}

.preview-content h2 {
  font-size: 1.5em;
  font-weight: 600;
  margin: 28px 0 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  letter-spacing: -0.3px;
}

.preview-content h3 { font-size: 1.25em; font-weight: 600; margin: 24px 0 10px; }
.preview-content h4 { font-size: 1.1em; font-weight: 600; margin: 20px 0 8px; }
.preview-content h5 { font-size: 1em; font-weight: 600; margin: 18px 0 6px; }
.preview-content h6 { font-size: 0.9em; font-weight: 600; margin: 16px 0 6px; color: var(--text-secondary); }
.preview-content p { margin: 0 0 16px; }
.preview-content strong { font-weight: 600; }

.preview-content a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
  border-bottom: 1px solid transparent;
  transition: border-color var(--transition);
}
.preview-content a:hover { border-bottom-color: var(--accent); }

.preview-content img { max-width: 100%; border-radius: var(--radius); }

.preview-content blockquote {
  border-left: 3px solid var(--accent);
  padding: 12px 20px;
  margin: 0 0 16px;
  color: var(--text-secondary);
  background: var(--accent-soft);
  border-radius: 0 var(--radius) var(--radius) 0;
  font-style: italic;
}

.preview-content blockquote p:last-child { margin-bottom: 0; }

.preview-content code {
  background: var(--bg-deep);
  padding: 2px 7px;
  border-radius: 5px;
  font-size: 0.85em;
  font-family: var(--mono);
  border: 1px solid var(--border);
}

.preview-content pre {
  background: var(--bg-deep);
  padding: 18px 20px;
  border-radius: var(--radius);
  overflow-x: auto;
  margin: 0 0 16px;
  border: 1px solid var(--border);
  position: relative;
}

.preview-content pre code {
  background: none;
  padding: 0;
  font-size: 13px;
  border: none;
  line-height: 1.6;
}

.preview-content table {
  border-collapse: collapse;
  width: 100%;
  margin: 0 0 16px;
  font-size: 14px;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
}

.preview-content th, .preview-content td {
  border: 1px solid var(--border);
  padding: 10px 14px;
  text-align: left;
}

.preview-content th {
  background: var(--bg-deep);
  font-weight: 600;
  font-size: 13px;
  text-transform: none;
  letter-spacing: 0;
}

.preview-content tr:hover td { background: var(--accent-soft); }

.preview-content ul, .preview-content ol { margin: 0 0 16px; padding-left: 26px; }
.preview-content li { margin: 5px 0; }
.preview-content li > ul, .preview-content li > ol { margin-bottom: 0; }

.preview-content hr {
  border: none;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-strong), transparent);
  margin: 32px 0;
}

.preview-content input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 16px; height: 16px;
  border: 2px solid var(--border-strong);
  border-radius: 4px;
  margin-right: 8px;
  vertical-align: middle;
  position: relative;
  top: -1px;
  cursor: default;
}

.preview-content input[type="checkbox"]:checked {
  background: var(--accent);
  border-color: var(--accent);
}

.preview-content input[type="checkbox"]:checked::after {
  content: '';
  position: absolute;
  left: 4px; top: 1px;
  width: 5px; height: 9px;
  border: solid white;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

/* Mermaid */
.preview-content .mermaid-container {
  margin: 16px 0;
  padding: 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow-x: auto;
  text-align: center;
}

.preview-content .mermaid-container svg {
  max-width: 100%;
  height: auto;
}

/* ========== SOURCE EDITOR ========== */
.source-wrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#source {
  width: 100%;
  flex: 1;
  border: none;
  outline: none;
  resize: none;
  padding: 20px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.75;
  background: var(--bg-card);
  color: var(--text);
  tab-size: 2;
}

#source::placeholder { color: var(--text-muted); }

/* ========== STATUS BAR ========== */
.statusbar {
  display: none;
  align-items: center;
  padding: 0 16px;
  height: 26px;
  border-top: 1px solid var(--border);
  background: var(--bg-deep);
  font-size: 11px;
  color: var(--text-muted);
  gap: 16px;
  flex-shrink: 0;
}

.statusbar.active { display: flex; }

.statusbar .stat {
  display: flex;
  align-items: center;
  gap: 5px;
}

.statusbar .dot {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--success);
}

/* ========== TOAST ========== */
.toast {
  position: fixed;
  bottom: 48px;
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: var(--text);
  color: var(--bg);
  padding: 10px 24px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 100;
  pointer-events: none;
  box-shadow: var(--shadow-lg);
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ========== HIDDEN ========== */
#file-input { display: none; }

/* ========== SCROLLBAR ========== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 99px;
}
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {
  .editor-area { flex-direction: column; }
  .divider { width: 100%; height: 1px; cursor: row-resize; }
  .divider::after { top: -3px; bottom: -3px; left: 0; right: 0; }
  .preview-content { padding: 20px; }
  .header { gap: 4px; padding: 0 8px; }
  .header .btn span.label { display: none; }
}

/* ========== MERMAID DARK ========== */
[data-theme="dark"] .mermaid-container {
  background: var(--bg-elevated);
}
</style>
</head>

<!-- Welcome Screen -->
<div class="welcome" id="welcome">
  <div class="welcome-logo">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V7.5L14.5 2z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <line x1="10" y1="9" x2="8" y2="9"/>
      </svg>
    </div>
    <h1>MD Editor</h1>
  </div>
  <p class="welcome-subtitle">
    实时预览 Markdown，支持 Mermaid 图表渲染、代码高亮、表格、任务列表等所有常用格式。
  </p>
  <div class="drop-zone" id="dropZone">
    <div class="drop-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>

    <span>拖拽 <span class="accent">.md</span> 文件到此处，或 <span class="accent">点击选择</span></span>
  </div>
  <div class="welcome-actions">
    <button class="btn btn-primary" onclick="newFile()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      新建文档
    </button>
    <button class="btn" onclick="loadDemo()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      加载示例
    </button>
    <button class="btn btn-ghost" id="themeToggleWelcome" onclick="toggleTheme()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
    </button>
  </div>
</div>

<!-- Header -->
<div class="header" id="header">
  <div class="header-brand">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V7.5L14.5 2z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
    </div>
  </div>
  <span class="filename" id="filenameBadge">untitled.md</span>

  <button class="btn" onclick="document.getElementById('file-input').click()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
    <span class="label">打开</span>
  </button>
  <button class="btn" onclick="newFile()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    <span class="label">新建</span>
  </button>
  <div class="separator"></div>
  <button class="btn" onclick="exportMd()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>

  const validLang = lang && hljs.getLanguage(lang);

// --- Render ---
async function renderPreview() {
  preview.innerHTML = marked.parse(source.value);

  // Render mermaid diagrams
  const mermaidContainers = preview.querySelectorAll('.mermaid-container');
  for (const container of mermaidContainers) {
    const code = container.textContent.trim();
    const uid = 'mmd_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    try {
      const { svg } = await mermaid.render(uid, code);
      container.innerHTML = svg;
    } catch (e) {
      container.innerHTML = '<pre style="color:var(--danger);font-size:12px;text-align:left">Mermaid Error: ' + (e.message || e) + '</pre>';
      // Clean up any leftover temp elements mermaid creates
      const temp = document.getElementById('d' + uid);
      if (temp) temp.remove();
    }
  }
}

  const text = source.value;

  $('wordCount').textContent = (text.match(/[一-鿿]|[a-zA-Z]+/g) || []).length + ' 词';
  $('lineCount').textContent = (text.match(/\n/g) || []).length + 1 + ' 行';
}

// --- Format insertion ---
function insertFormat(type) {
  source.focus();
  const start = source.selectionStart;
  const end = source.selectionEnd;
  const text = source.value;
  const selected = text.slice(start, end);
  let before = '', after = '', insert = '';
  const lineStart = text.lastIndexOf('\n', start - 1) + 1;

  switch (type) {
    case 'bold':      before = '**'; after = '**'; insert = selected || '粗体文本'; break;
    case 'italic':    before = '*';  after = '*';  insert = selected || '斜体文本'; break;
    case 'strike':    before = '~~'; after = '~~'; insert = selected || '删除线文本'; break;
    case 'code':      before = '`';  after = '`';  insert = selected || 'code'; break;
    case 'h1':        before = '# '; insert = selected || '标题'; break;
    case 'h2':        before = '## '; insert = selected || '标题'; break;
    case 'h3':        before = '### '; insert = selected || '标题'; break;
    case 'ul':        before = '- '; insert = selected || '列表项'; break;
    case 'ol':        before = '1. '; insert = selected || '列表项'; break;
    case 'task':      before = '- [ ] '; insert = selected || '任务项'; break;
    case 'quote':     before = '> '; insert = selected || '引用文本'; break;
    case 'link':      before = '['; after = '](url)'; insert = selected || '链接文本'; break;
    case 'image':     before = '!['; after = '](url)'; insert = selected || 'alt text'; break;
    case 'hr':        before = '\n---\n'; insert = ''; break;
    case 'table':
      insert = '\n| 列1 | 列2 | 列3 |\n|------|------|------|\n| 内容 | 内容 | 内容 |\n';
      break;
    case 'codeblock':
      before = '\n```\n'; after = '\n```\n'; insert = selected || '// code here';
      break;
    case 'mermaid':
      before = '\n```mermaid\n'; after = '\n```\n'; insert = selected || 'flowchart LR\n    A["开始"] --> B["结束"]';
      break;
  }

  if (['h1','h2','h3','ul','ol','task','quote'].includes(type) && !selected) {
    const replacement = before + insert + after;
    source.value = text.slice(0, lineStart) + replacement + text.slice(end);
    source.selectionStart = source.selectionEnd = lineStart + replacement.length;
  } else {
    const replacement = before + insert + after;
    source.value = text.slice(0, start) + replacement + text.slice(end);
    source.selectionStart = start + before.length;
    source.selectionEnd = start + before.length + insert.length;
  }

  source.dispatchEvent(new Event('input'));
}

// --- Keyboard shortcuts ---
source.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'b') { e.preventDefault(); insertFormat('bold'); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'i') { e.preventDefault(); insertFormat('italic'); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); insertFormat('link'); }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); exportMd(); }
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = source.selectionStart;
    source.value = source.value.slice(0, s) + '  ' + source.value.slice(source.selectionEnd);
    source.selectionStart = source.selectionEnd = s + 2;
    source.dispatchEvent(new Event('input'));
  }
});

  const name = currentFilename.replace(/\.md$/, '.html');

}

function copyToClipboard() {
  navigator.clipboard.writeText(source.value).then(() => showToast('已复制到剪贴板'));
}

function download(content, filename, mime) {
  const blob = new Blob([content], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// --- Toast ---
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// --- Sync scroll ---
const previewScroll = previewPane.querySelector('.preview-scroll');

previewScroll.addEventListener('scroll', () => {
  if (!syncScrolling || currentView !== 'both') return;
  const ratio = previewScroll.scrollTop / (previewScroll.scrollHeight - previewScroll.clientHeight || 1);
  syncScrolling = false;
  source.scrollTop = ratio * (source.scrollHeight - source.clientHeight);
  setTimeout(() => syncScrolling = true, 50);
});

source.addEventListener('scroll', () => {
  if (!syncScrolling || currentView !== 'both') return;
  const ratio = source.scrollTop / (source.scrollHeight - source.clientHeight || 1);
  syncScrolling = false;
  previewScroll.scrollTop = ratio * (previewScroll.scrollHeight - previewScroll.clientHeight);
  setTimeout(() => syncScrolling = true, 50);
});
</script>
