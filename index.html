<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Editor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #fafbfc; --bg-deep: #f0f2f5; --bg-card: #ffffff; --bg-elevated: #ffffff;
  --border: rgba(0,0,0,0.08); --border-strong: rgba(0,0,0,0.15);
  --text: #0f172a; --text-secondary: #64748b; --text-muted: #94a3b8;
  --accent: #6366f1; --accent-soft: rgba(99,102,241,0.08); --accent-hover: #4f46e5; --accent-glow: rgba(99,102,241,0.15);
  --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
  --radius: 10px; --radius-sm: 6px; --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04); --shadow: 0 2px 8px rgba(0,0,0,0.06); --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
  --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
  --font: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono: 'JetBrains Mono','SF Mono','Fira Code',monospace;
  --sidebar-w: 260px;
}
[data-theme="dark"] {
  --bg: #0c0e14; --bg-deep: #111318; --bg-card: #16181f; --bg-elevated: #1c1e27;
  --border: rgba(255,255,255,0.06); --border-strong: rgba(255,255,255,0.12);
  --text: #e2e8f0; --text-secondary: #94a3b8; --text-muted: #475569;
  --accent: #818cf8; --accent-soft: rgba(129,140,248,0.1); --accent-hover: #a5b4fc; --accent-glow: rgba(129,140,248,0.12);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.2); --shadow: 0 2px 8px rgba(0,0,0,0.3); --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
}
body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }

/* ===== BUTTONS ===== */
.btn { padding:7px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg-card); color:var(--text); font-size:12px; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:all var(--transition); font-family:var(--font); white-space:nowrap; }
.btn:hover { background:var(--bg-elevated); border-color:var(--border-strong); box-shadow:var(--shadow-sm); }
.btn:active { transform:scale(0.97); }
.btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn-primary:hover { background:var(--accent-hover); }
.btn-ghost { background:transparent; border-color:transparent; color:var(--text-secondary); }
.btn-ghost:hover { background:var(--accent-soft); color:var(--accent); border-color:transparent; }
.btn-danger:hover { background:rgba(239,68,68,0.1); color:var(--danger); border-color:var(--danger); }
.btn-sm { padding:4px 8px; font-size:11px; }
.btn svg { width:14px; height:14px; flex-shrink:0; }

/* ===== HEADER ===== */
.header { display:flex; align-items:center; padding:0 12px; height:48px; border-bottom:1px solid var(--border); background:var(--bg-card); gap:6px; flex-shrink:0; z-index:20; }
.header-brand { display:flex; align-items:center; gap:8px; margin-right:8px; cursor:pointer; }
.header-brand .icon { width:28px; height:28px; background:linear-gradient(135deg,var(--accent),#a78bfa); border-radius:8px; display:flex; align-items:center; justify-content:center; }
.header-brand .icon svg { width:15px; height:15px; color:white; }
.header-brand span { font-weight:700; font-size:14px; }
.filename { font-size:13px; font-weight:500; margin-right:auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text-secondary); }
.separator { width:1px; height:20px; background:var(--border); margin:0 2px; }

/* ===== LAYOUT ===== */
.app-body { display:flex; flex:1; overflow:hidden; }

/* ===== SIDEBAR ===== */
.sidebar { width:var(--sidebar-w); border-right:1px solid var(--border); background:var(--bg-deep); display:flex; flex-direction:column; flex-shrink:0; transition:width var(--transition),opacity var(--transition); overflow:hidden; }
.sidebar.collapsed { width:0; opacity:0; pointer-events:none; }
.sidebar-header { padding:10px 12px; border-bottom:1px solid var(--border); display:flex; gap:4px; flex-shrink:0; }
.sidebar-header .btn { flex:1; justify-content:center; font-size:11px; padding:5px 6px; }
.file-tree { flex:1; overflow-y:auto; padding:6px 0; }
.file-tree-item { display:flex; align-items:center; padding:5px 12px; cursor:pointer; font-size:13px; transition:background 0.1s; gap:6px; user-select:none; position:relative; }
.file-tree-item:hover { background:var(--accent-soft); }
.file-tree-item.active { background:var(--accent-soft); color:var(--accent); font-weight:500; }
.file-tree-item .icon { width:16px; height:16px; flex-shrink:0; opacity:0.6; }
.file-tree-item .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.file-tree-item .actions { display:none; gap:2px; }
.file-tree-item:hover .actions { display:flex; }
.file-tree-item .actions button { background:none; border:none; cursor:pointer; color:var(--text-muted); padding:2px; border-radius:3px; display:flex; }
.file-tree-item .actions button:hover { color:var(--danger); background:rgba(239,68,68,0.1); }
.file-tree-folder { font-weight:500; }
.file-tree-indent { width:16px; flex-shrink:0; }
.folder-toggle { width:14px; height:14px; flex-shrink:0; transition:transform 0.15s; cursor:pointer; }
.folder-toggle.open { transform:rotate(90deg); }
.sidebar-footer { padding:8px 12px; border-top:1px solid var(--border); display:flex; gap:4px; }
.sidebar-footer .btn { flex:1; justify-content:center; font-size:11px; }

/* ===== TOOLBAR ===== */
.toolbar { display:flex; align-items:center; padding:3px 12px; border-bottom:1px solid var(--border); background:var(--bg-card); gap:1px; flex-shrink:0; }
.toolbar-group { display:flex; align-items:center; gap:1px; padding:2px; background:var(--bg-deep); border-radius:var(--radius-sm); margin:0 3px; }
.toolbar-btn { width:30px; height:28px; border:none; background:transparent; border-radius:5px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text-secondary); transition:all 0.12s; font-size:13px; font-family:var(--font); font-weight:600; position:relative; }
.toolbar-btn:hover { background:var(--bg-card); color:var(--text); box-shadow:var(--shadow-sm); }
.toolbar-btn.active { background:var(--accent); color:#fff; }
.toolbar-btn svg { width:15px; height:15px; }
.view-modes { display:flex; gap:1px; margin-left:auto; background:var(--bg-deep); border-radius:var(--radius-sm); padding:2px; }

/* ===== EDITOR AREA ===== */
.main-area { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.editor-area { display:flex; flex:1; overflow:hidden; }
.pane { flex:1; overflow:auto; display:flex; flex-direction:column; }
.pane-header { position:sticky; top:0; z-index:5; padding:7px 20px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-muted); background:var(--bg-card); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; flex-shrink:0; }
.pane-header::before { content:''; width:3px; height:3px; border-radius:50%; background:var(--accent); }
.divider { width:1px; background:var(--border); cursor:col-resize; flex-shrink:0; transition:all var(--transition); position:relative; }
.divider::after { content:''; position:absolute; top:0; bottom:0; left:-3px; right:-3px; z-index:10; }
.divider:hover,.divider.dragging { background:var(--accent); box-shadow:0 0 8px var(--accent-glow); }

/* ===== PREVIEW ===== */
.preview-scroll { flex:1; overflow:auto; }
.preview-content { padding:32px 40px 80px; max-width:900px; line-height:1.8; font-size:15px; margin:0 auto; }
.preview-content h1 { font-size:2em; font-weight:700; margin:32px 0 16px; padding-bottom:12px; border-bottom:2px solid var(--border); letter-spacing:-0.5px; }
.preview-content h2 { font-size:1.5em; font-weight:600; margin:28px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--border); }
.preview-content h3 { font-size:1.25em; font-weight:600; margin:24px 0 10px; }
.preview-content h4 { font-size:1.1em; font-weight:600; margin:20px 0 8px; }
.preview-content h5 { font-size:1em; font-weight:600; margin:18px 0 6px; }
.preview-content h6 { font-size:0.9em; font-weight:600; margin:16px 0 6px; color:var(--text-secondary); }
.preview-content p { margin:0 0 16px; }
.preview-content strong { font-weight:600; }
.preview-content a { color:var(--accent); text-decoration:none; font-weight:500; }
.preview-content a:hover { text-decoration:underline; }
.preview-content img { max-width:100%; border-radius:var(--radius); }
.preview-content blockquote { border-left:3px solid var(--accent); padding:12px 20px; margin:0 0 16px; color:var(--text-secondary); background:var(--accent-soft); border-radius:0 var(--radius) var(--radius) 0; font-style:italic; }
.preview-content blockquote p:last-child { margin-bottom:0; }
.preview-content code { background:var(--bg-deep); padding:2px 7px; border-radius:5px; font-size:0.85em; font-family:var(--mono); border:1px solid var(--border); }
.preview-content pre { background:var(--bg-deep); padding:18px 20px; border-radius:var(--radius); overflow-x:auto; margin:0 0 16px; border:1px solid var(--border); }
.preview-content pre code { background:none; padding:0; font-size:13px; border:none; line-height:1.6; }
.preview-content table { border-collapse:collapse; width:100%; margin:0 0 16px; font-size:14px; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.preview-content th,.preview-content td { border:1px solid var(--border); padding:10px 14px; text-align:left; }
.preview-content th { background:var(--bg-deep); font-weight:600; font-size:13px; }
.preview-content tr:hover td { background:var(--accent-soft); }
.preview-content ul,.preview-content ol { margin:0 0 16px; padding-left:26px; }
.preview-content li { margin:5px 0; }
.preview-content li>ul,.preview-content li>ol { margin-bottom:0; }
.preview-content hr { border:none; height:1px; background:linear-gradient(90deg,transparent,var(--border-strong),transparent); margin:32px 0; }
.preview-content input[type="checkbox"] { appearance:none; -webkit-appearance:none; width:16px; height:16px; border:2px solid var(--border-strong); border-radius:4px; margin-right:8px; vertical-align:middle; position:relative; top:-1px; cursor:default; }
.preview-content input[type="checkbox"]:checked { background:var(--accent); border-color:var(--accent); }
.preview-content input[type="checkbox"]:checked::after { content:''; position:absolute; left:4px; top:1px; width:5px; height:9px; border:solid white; border-width:0 2px 2px 0; transform:rotate(45deg); }
.preview-content .mermaid-container { margin:16px 0; padding:20px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); overflow-x:auto; text-align:center; }
[data-theme="dark"] .mermaid-container { background:var(--bg-elevated); }

/* ===== COLLAPSIBLE HEADINGS ===== */
.preview-content .heading-wrapper { position:relative; }
.preview-content .heading-toggle { position:absolute; left:-24px; top:50%; transform:translateY(-50%); width:18px; height:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:4px; color:var(--text-muted); transition:all 0.15s; background:none; border:none; padding:0; }
.preview-content .heading-toggle:hover { background:var(--accent-soft); color:var(--accent); }
.preview-content .heading-toggle svg { width:12px; height:12px; transition:transform 0.2s; }
.preview-content .heading-toggle.collapsed svg { transform:rotate(-90deg); }
.preview-content .heading-collapsed { display:none !important; }

/* ===== SOURCE ===== */
.source-wrapper { flex:1; display:flex; flex-direction:column; overflow:hidden; }
#source { width:100%; flex:1; border:none; outline:none; resize:none; padding:20px; font-family:var(--mono); font-size:13px; line-height:1.75; background:var(--bg-card); color:var(--text); tab-size:2; }
#source::placeholder { color:var(--text-muted); }

/* ===== STATUSBAR ===== */
.statusbar { display:flex; align-items:center; padding:0 16px; height:26px; border-top:1px solid var(--border); background:var(--bg-deep); font-size:11px; color:var(--text-muted); gap:16px; flex-shrink:0; }
.statusbar .dot { width:4px; height:4px; border-radius:50%; background:var(--success); margin-right:5px; display:inline-block; }

/* ===== TOAST ===== */
.toast { position:fixed; bottom:48px; left:50%; transform:translateX(-50%) translateY(12px); background:var(--text); color:var(--bg); padding:10px 24px; border-radius:999px; font-size:13px; font-weight:500; opacity:0; transition:all 0.3s; z-index:100; pointer-events:none; box-shadow:var(--shadow-lg); }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ===== MODAL ===== */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:200; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.2s; }
.modal-overlay.show { opacity:1; pointer-events:all; }
.modal { background:var(--bg-card); border-radius:var(--radius-lg); padding:24px; width:380px; max-width:90vw; box-shadow:var(--shadow-lg); }
.modal h3 { font-size:16px; margin-bottom:16px; }
.modal input[type="text"] { width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg); color:var(--text); font-size:14px; font-family:var(--font); outline:none; margin-bottom:16px; }
.modal input[type="text"]:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); }
.modal-actions { display:flex; gap:8px; justify-content:flex-end; }

/* ===== CONTEXT MENU ===== */
.ctx-menu { position:fixed; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-lg); padding:4px; z-index:300; min-width:160px; }
.ctx-menu-item { padding:7px 14px; font-size:13px; cursor:pointer; border-radius:var(--radius-sm); display:flex; align-items:center; gap:8px; }
.ctx-menu-item:hover { background:var(--accent-soft); color:var(--accent); }
.ctx-menu-item.danger:hover { background:rgba(239,68,68,0.1); color:var(--danger); }
.ctx-menu-sep { height:1px; background:var(--border); margin:4px 0; }

/* ===== EMPTY STATE ===== */
.empty-state { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text-muted); gap:12px; padding:40px; }
.empty-state svg { width:48px; height:48px; opacity:0.3; }
.empty-state p { font-size:14px; }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border-strong); border-radius:99px; }
::-webkit-scrollbar-thumb:hover { background:var(--text-muted); }

#file-input { display:none; }

@media (max-width:768px) {
  .sidebar { position:absolute; z-index:50; height:100%; box-shadow:var(--shadow-lg); }
  .sidebar.collapsed { width:0; }
  .editor-area { flex-direction:column; }
  .divider { width:100%; height:1px; cursor:row-resize; }
  .preview-content { padding:20px; }
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-brand" onclick="toggleSidebar()">
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></div>
    <span>MD Editor</span>
  </div>
  <span class="filename" id="filenameBadge">未选择文件</span>
  <button class="btn" onclick="fileInput.click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span class="label">上传</span></button>
  <div class="separator"></div>
  <button class="btn" onclick="exportCurrentMd()" id="btnExportMd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span class="label">MD</span></button>
  <button class="btn" onclick="exportCurrentHtml()" id="btnExportHtml"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg><span class="label">HTML</span></button>
  <button class="btn" onclick="exportAllZip()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8m-4-4h8"/></svg><span class="label">全部导出</span></button>
  <div class="separator"></div>
  <button class="btn btn-ghost" onclick="toggleTheme()" id="themeBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button>
</div>

<div class="app-body">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="btn btn-sm" onclick="promptNewFile()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> 新建文件</button>
      <button class="btn btn-sm" onclick="promptNewFolder()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg> 新建文件夹</button>
    </div>
    <div class="file-tree" id="fileTree"></div>
    <div class="sidebar-footer">
      <button class="btn btn-sm btn-ghost" onclick="exportAllZip()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 导出全部</button>
    </div>
  </div>

  <!-- Main Area -->
  <div class="main-area" id="mainArea">
    <!-- Empty state -->
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.5 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <p>从左侧选择或创建一个文档开始编辑</p>
    </div>

    <!-- Toolbar -->
    <div class="toolbar" id="toolbar" style="display:none">
      <div class="toolbar-group">
        <button class="toolbar-btn" onclick="insertFormat('bold')" title="粗体"><b>B</b></button>
        <button class="toolbar-btn" onclick="insertFormat('italic')" title="斜体"><i style="font-style:italic">I</i></button>
        <button class="toolbar-btn" onclick="insertFormat('strike')" title="删除线"><s>S</s></button>
        <button class="toolbar-btn" onclick="insertFormat('code')" title="代码"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></button>
      </div>
      <div class="toolbar-group">
        <button class="toolbar-btn" onclick="insertFormat('h1')" title="H1" style="font-size:14px">H1</button>
        <button class="toolbar-btn" onclick="insertFormat('h2')" title="H2" style="font-size:13px">H2</button>
        <button class="toolbar-btn" onclick="insertFormat('h3')" title="H3" style="font-size:12px">H3</button>
      </div>
      <div class="toolbar-group">
        <button class="toolbar-btn" onclick="insertFormat('ul')" title="列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg></button>
        <button class="toolbar-btn" onclick="insertFormat('ol')" title="有序列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><text x="3" y="8" font-size="8" fill="currentColor">1</text><text x="3" y="14" font-size="8" fill="currentColor">2</text><text x="3" y="20" font-size="8" fill="currentColor">3</text></svg></button>
        <button class="toolbar-btn" onclick="insertFormat('task')" title="任务"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="6" height="6" rx="1"/><polyline points="4.5 8 6 9.5 8.5 6.5"/><line x1="12" y1="8" x2="21" y2="8"/><rect x="3" y="14" width="6" height="6" rx="1"/><line x1="12" y1="17" x2="21" y2="17"/></svg></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

<script>
// ============================================================
// FileStore — IndexedDB persistence
// ============================================================
class FileStore {
  constructor() { this.dbName = 'md-editor'; this.storeName = 'files'; this.db = null; }

  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.dbName, 1);
      req.onupgradeneeded = e => { e.target.result.createObjectStore(this.storeName, { keyPath: 'path' }); };
      req.onsuccess = e => { this.db = e.target.result; resolve(this.db); };
      req.onerror = e => reject(e);
    });
  }

  async _tx(mode) { const db = await this.open(); return db.transaction(this.storeName, mode).objectStore(this.storeName); }

  async getAll() {
    const store = await this._tx('readonly');
    return new Promise(r => { const req = store.getAll(); req.onsuccess = () => r(req.result); });
  }

  async get(path) {
    const store = await this._tx('readonly');
    return new Promise(r => { const req = store.get(path); req.onsuccess = () => r(req.result); });
  }

  async put(item) {
    const store = await this._tx('readwrite');
    return new Promise((resolve, reject) => { const req = store.put(item); req.onsuccess = () => resolve(); req.onerror = e => reject(e); });
  }

  async delete(path) {
    const store = await this._tx('readwrite');
    return new Promise(r => { const req = store.delete(path); req.onsuccess = () => r(); });
  }

  async deleteRecursive(path) {
    const all = await this.getAll();
    const toDelete = all.filter(f => f.path === path || f.path.startsWith(path + '/'));
    for (const f of toDelete) await this.delete(f.path);
  }

  async getChildren(parentPath) {
    const all = await this.getAll();
    return all.filter(f => f.parentPath === parentPath).sort((a, b) => {
      if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1;
      return a.name.localeCompare(b.name);
    });
  }

  async isEmpty() { const all = await this.getAll(); return all.length === 0; }
}

const store = new FileStore();
const fileInput = document.getElementById('file-input');
let currentFilePath = null;
let currentView = 'both';
let syncScrolling = true;
let mermaidId = 0;
let expandedFolders = new Set(['/']);
let saveTimer = null;

// ============================================================
// Marked + Mermaid + hljs setup
// ============================================================
function initMermaid() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  mermaid.initialize({
    startOnLoad: false, theme: isDark ? 'dark' : 'default', securityLevel: 'loose', fontFamily: 'Inter,sans-serif',
    flowchart: { useMaxWidth: true, htmlLabels: true, curve: 'basis' }, sequence: { useMaxWidth: true },
    themeVariables: isDark
      ? { primaryColor:'#818cf8', primaryTextColor:'#e2e8f0', primaryBorderColor:'#4f46e5', lineColor:'#475569', secondaryColor:'#1e293b', tertiaryColor:'#1c1e27' }
      : { primaryColor:'#6366f1', primaryTextColor:'#0f172a', primaryBorderColor:'#4f46e5', lineColor:'#94a3b8', secondaryColor:'#f1f5f9', tertiaryColor:'#fafbfc' }
  });
}
initMermaid();

const renderer = new marked.Renderer();
renderer.code = function(code, lang) {
  if (lang === 'mermaid') { mermaidId++; return '<div class="mermaid-container" data-mermaid-id="m'+mermaidId+'">'+code+'</div>'; }
  const valid = lang && hljs.getLanguage(lang);
  const hl = valid ? hljs.highlight(code,{language:lang}).value : hljs.highlightAuto(code).value;
  return '<pre><code class="hljs'+(valid?' language-'+lang:'')+'">'+hl+'</code></pre>';
};
marked.setOptions({ renderer, breaks: true, gfm: true });

// ============================================================
// DOM refs
// ============================================================
const $ = id => document.getElementById(id);
const sourceEl = $('source');
const previewEl = $('preview');
const previewPane = $('previewPane');
const sourcePane = $('sourcePane');
const dividerEl = $('divider');

// ============================================================
// Theme
// ============================================================
function updateHljsTheme() {
  const d = document.documentElement.getAttribute('data-theme') === 'dark';
  $('hljs-theme').href = d ? 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css' : 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
}
function toggleTheme() {
  const d = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', d ? '' : 'dark');
  localStorage.setItem('md-theme', d ? 'light' : 'dark');
  updateHljsTheme(); initMermaid(); if (currentFilePath) renderPreview();
}
(function() {
  const s = localStorage.getItem('md-theme');
  if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme:dark)').matches)) document.documentElement.setAttribute('data-theme','dark');
  updateHljsTheme();
})();

// ============================================================
// Sidebar toggle
// ============================================================
function toggleSidebar() { $('sidebar').classList.toggle('collapsed'); }

// ============================================================
// File Tree Rendering
// ============================================================
async function renderFileTree() {
  const tree = $('fileTree');
  tree.innerHTML = '';
  await renderTreeLevel('/', tree, 0);
}

async function renderTreeLevel(parentPath, container, depth) {
  const children = await store.getChildren(parentPath);
  for (const item of children) {
    const el = document.createElement('div');
    el.className = 'file-tree-item' + (item.isFolder ? ' file-tree-folder' : '') + (item.path === currentFilePath ? ' active' : '');
    el.style.paddingLeft = (12 + depth * 16) + 'px';
    el.setAttribute('data-path', item.path);

    if (item.isFolder) {
      const isOpen = expandedFolders.has(item.path);
      el.innerHTML = `<svg class="folder-toggle ${isOpen?'open':''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
        <span class="name">${item.name}</span>
        <span class="actions"><button onclick="event.stopPropagation();deleteItem('${item.path}',true)" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button></span>`;
      el.onclick = (e) => {
        if (e.target.closest('.actions')) return;
        if (expandedFolders.has(item.path)) expandedFolders.delete(item.path); else expandedFolders.add(item.path);
        renderFileTree();
      };
      el.oncontextmenu = (e) => { e.preventDefault(); showCtxMenu(e, item); };
      container.appendChild(el);
      if (isOpen) await renderTreeLevel(item.path, container, depth + 1);
    } else {
      el.innerHTML = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span class="name">${item.name}</span>
        <span class="actions"><button onclick="event.stopPropagation();deleteItem('${item.path}',false)" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button></span>`;
      el.onclick = () => openFile(item.path);
      el.oncontextmenu = (e) => { e.preventDefault(); showCtxMenu(e, item); };
      container.appendChild(el);
    }
  }
}

// ============================================================
// Context Menu
// ============================================================
function showCtxMenu(e, item) {
  const menu = $('ctxMenu');
  let html = `<div class="ctx-menu-item" onclick="promptRename('${item.path}')">&#9998; 重命名</div>`;
  if (item.isFolder) {
    html += `<div class="ctx-menu-item" onclick="exportFolderZip('${item.path}')">&#8615; 导出为 ZIP</div>`;
  }
  html += `<div class="ctx-menu-sep"></div><div class="ctx-menu-item danger" onclick="deleteItem('${item.path}',${item.isFolder})">&#10005; 删除</div>`;
  menu.innerHTML = html;
  menu.style.left = e.clientX + 'px'; menu.style.top = e.clientY + 'px'; menu.style.display = 'block';
}
document.addEventListener('click', () => { $('ctxMenu').style.display = 'none'; });

// ============================================================
// File Operations
// ============================================================
async function openFile(path) {
  if (currentFilePath) await autoSave();
  const item = await store.get(path);
  if (!item || item.isFolder) return;
  currentFilePath = path;
  $('filenameBadge').textContent = item.name;
  sourceEl.value = item.content || '';
  $('toolbar').style.display = 'flex';
  $('editorArea').style.display = 'flex';
  $('emptyState').style.display = 'none';
  mermaidId = 0;
  renderPreview();
  updateStats();
  renderFileTree();
  sourceEl.focus();
}

async function autoSave() {
  if (!currentFilePath) return;
  const item = await store.get(currentFilePath);
  if (item && !item.isFolder) {
    item.content = sourceEl.value;
    item.updatedAt = Date.now();
    await store.put(item);
  }
}

function scheduleAutoSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(autoSave, 500);
}

async function promptNewFile() {
  const name = await showPrompt('新建文件', '文件名（自动添加 .md）', 'untitled');
  if (!name) return;
  const fname = name.endsWith('.md') ? name : name + '.md';
  const path = '/' + fname;
  const existing = await store.get(path);
  if (existing) { showToast('文件已存在'); return; }
  await store.put({ path, name: fname, content: '', isFolder: false, parentPath: '/', createdAt: Date.now(), updatedAt: Date.now() });
  await renderFileTree();
  openFile(path);
}

async function promptNewFolder() {
  const name = await showPrompt('新建文件夹', '文件夹名', '新文件夹');
  if (!name) return;
  const path = '/' + name;
  const existing = await store.get(path);
  if (existing) { showToast('文件夹已存在'); return; }
  await store.put({ path, name, content: '', isFolder: true, parentPath: '/', createdAt: Date.now(), updatedAt: Date.now() });
  expandedFolders.add(path);
  await renderFileTree();
  showToast('已创建文件夹: ' + name);
}

async function deleteItem(path, isFolder) {
  const msg = isFolder ? '确定删除该文件夹及其所有文件？' : '确定删除该文件？';
  if (!confirm(msg)) return;
  if (isFolder) { await store.deleteRecursive(path); } else { await store.delete(path); }
  if (currentFilePath === path || (isFolder && currentFilePath && currentFilePath.startsWith(path + '/'))) {
    currentFilePath = null;
    $('toolbar').style.display = 'none';
    $('editorArea').style.display = 'none';
    $('emptyState').style.display = 'flex';
    $('filenameBadge').textContent = '未选择文件';
  }
  await renderFileTree();
  showToast('已删除');
}

async function promptRename(path) {
  $('ctxMenu').style.display = 'none';
  const item = await store.get(path);
  if (!item) return;
  const newName = await showPrompt('重命名', '新名称', item.name);
  if (!newName || newName === item.name) return;
  const newPath = item.parentPath + (item.parentPath === '/' ? '' : '/') + (item.isFolder ? newName : (newName.endsWith('.md') ? newName : newName + '.md'));
  if (item.isFolder) {
    const all = await store.getAll();
    const children = all.filter(f => f.path.startsWith(path + '/'));
    await store.delete(path);
    item.path = newPath; item.name = newName; await store.put(item);
    for (const child of children) {
      await store.delete(child.path);
      child.path = child.path.replace(path, newPath);
      child.parentPath = child.parentPath.replace(path, newPath);
      await store.put(child);
    }
    if (expandedFolders.has(path)) { expandedFolders.delete(path); expandedFolders.add(newPath); }
  } else {
    await store.delete(path);
    const finalName = newName.endsWith('.md') ? newName : newName + '.md';
    item.path = newPath; item.name = finalName; await store.put(item);
    if (currentFilePath === path) { currentFilePath = newPath; $('filenameBadge').textContent = finalName; }
  }
  await renderFileTree();
  showToast('已重命名');
}

// Upload
fileInput.addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    const name = file.name;
    const path = '/' + name;
    await store.put({ path, name, content: ev.target.result, isFolder: false, parentPath: '/', createdAt: Date.now(), updatedAt: Date.now() });
    await renderFileTree();
    openFile(path);
    showToast('已上传: ' + name);
  };
  reader.readAsText(file);
  fileInput.value = '';
});

// Drag & drop
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', async e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && /\.(md|markdown|txt)$/i.test(file.name)) {
    const reader = new FileReader();
    reader.onload = async ev => {
      const path = '/' + file.name;
      await store.put({ path, name: file.name, content: ev.target.result, isFolder: false, parentPath: '/', createdAt: Date.now(), updatedAt: Date.now() });
      await renderFileTree();
      openFile(path);
    };
    reader.readAsText(file);
  }
});

// ============================================================
// Render & Stats
// ============================================================
async function renderPreview() {
  previewEl.innerHTML = marked.parse(sourceEl.value);
  // Mermaid
  const containers = previewEl.querySelectorAll('.mermaid-container');
  for (const c of containers) {
    const code = c.textContent.trim();
    const uid = 'mmd_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    try { const { svg } = await mermaid.render(uid, code); c.innerHTML = svg; }
    catch (e) { c.innerHTML = '<pre style="color:var(--danger);font-size:12px">Mermaid Error: '+(e.message||e)+'</pre>'; }
  }
  setupCollapsibleHeadings();
}

function updateStats() {
  const t = sourceEl.value;
  $('charCount').textContent = t.length + ' 字符';
  $('wordCount').textContent = (t.match(/[一-鿿]|[a-zA-Z]+/g)||[]).length + ' 词';
  $('lineCount').textContent = (t.match(/\n/g)||[]).length + 1 + ' 行';
}

sourceEl.addEventListener('input', () => {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { mermaidId = 0; renderPreview(); updateStats(); autoSave(); }, 200);
});

// ============================================================
// Collapsible Headings
// ============================================================
function setupCollapsibleHeadings() {
  const content = previewEl;
  const headings = content.querySelectorAll('h1,h2,h3,h4,h5,h6');
  headings.forEach(h => {
    if (h.querySelector('.heading-toggle')) return;
    h.style.position = 'relative';
    h.style.paddingLeft = '24px';
    const btn = document.createElement('button');
    btn.className = 'heading-toggle';
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>';
    btn.onclick = (e) => {
      e.stopPropagation();
      const collapsed = btn.classList.toggle('collapsed');
      const level = parseInt(h.tagName[1]);
      let el = h.nextElementSibling;
      while (el) {
        if (/^H[1-6]$/.test(el.tagName) && parseInt(el.tagName[1]) <= level) break;
        if (collapsed) el.classList.add('heading-collapsed'); else el.classList.remove('heading-collapsed');
        el = el.nextElementSibling;
      }
    };
    h.prepend(btn);
  });
}

// ============================================================
// View Modes
// ============================================================
function setView(mode) {
  currentView = mode;
  ['viewBoth','viewPreview','viewSource'].forEach(id => $(id).classList.remove('active'));
  $('view'+mode.charAt(0).toUpperCase()+mode.slice(1)).classList.add('active');
  previewPane.style.display = mode === 'source' ? 'none' : '';
  sourcePane.style.display = mode === 'preview' ? 'none' : '';
  dividerEl.style.display = mode === 'both' ? '' : 'none';
}
setView('both');

// Divider drag
let isDragging = false;
dividerEl.addEventListener('mousedown', e => { isDragging = true; dividerEl.classList.add('dragging'); document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none'; e.preventDefault(); });
document.addEventListener('mousemove', e => { if (!isDragging) return; const r = $('editorArea').getBoundingClientRect(); const ratio = Math.max(0.2,Math.min(0.8,(e.clientX-r.left)/r.width)); previewPane.style.flex = ratio; sourcePane.style.flex = 1 - ratio; });
document.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; dividerEl.classList.remove('dragging'); document.body.style.cursor = ''; document.body.style.userSelect = ''; } });

// Sync scroll
const previewScroll = previewPane.querySelector('.preview-scroll');
previewScroll.addEventListener('scroll', () => { if (!syncScrolling || currentView !== 'both') return; const r = previewScroll.scrollTop / (previewScroll.scrollHeight - previewScroll.clientHeight || 1); syncScrolling = false; sourceEl.scrollTop = r * (sourceEl.scrollHeight - sourceEl.clientHeight); setTimeout(() => syncScrolling = true, 50); });
sourceEl.addEventListener('scroll', () => { if (!syncScrolling || currentView !== 'both') return; const r = sourceEl.scrollTop / (sourceEl.scrollHeight - sourceEl.clientHeight || 1); syncScrolling = false; previewScroll.scrollTop = r * (previewScroll.scrollHeight - previewScroll.clientHeight); setTimeout(() => syncScrolling = true, 50); });

// ============================================================
// Format Insertion
// ============================================================
function insertFormat(type) {
  sourceEl.focus();
  const start = sourceEl.selectionStart, end = sourceEl.selectionEnd, text = sourceEl.value, sel = text.slice(start, end);
  let before = '', after = '', insert = '';
  const ls = text.lastIndexOf('\n', start - 1) + 1;
  switch (type) {
    case 'bold': before='**'; after='**'; insert=sel||'粗体'; break;
    case 'italic': before='*'; after='*'; insert=sel||'斜体'; break;
    case 'strike': before='~~'; after='~~'; insert=sel||'删除线'; break;
    case 'code': before='`'; after='`'; insert=sel||'code'; break;
    case 'h1': before='# '; insert=sel||'标题'; break;
    case 'h2': before='## '; insert=sel||'标题'; break;
    case 'h3': before='### '; insert=sel||'标题'; break;
    case 'ul': before='- '; insert=sel||'列表项'; break;
    case 'ol': before='1. '; insert=sel||'列表项'; break;
    case 'task': before='- [ ] '; insert=sel||'任务'; break;
    case 'quote': before='> '; insert=sel||'引用'; break;
    case 'link': before='['; after='](url)'; insert=sel||'链接'; break;
    case 'image': before='!['; after='](url)'; insert=sel||'图片'; break;
    case 'hr': before='\n---\n'; insert=''; break;
    case 'table': insert='\n| 列1 | 列2 | 列3 |\n|---|---|---|\n| - | - | - |\n'; break;
    case 'codeblock': before='\n```\n'; after='\n```\n'; insert=sel||'code'; break;
    case 'mermaid': before='\n```mermaid\n'; after='\n```\n'; insert=sel||'flowchart LR\n    A --> B'; break;
  }
  if (['h1','h2','h3','ul','ol','task','quote'].includes(type) && !sel) {
    const rep = before + insert + after;
    sourceEl.value = text.slice(0,ls) + rep + text.slice(end);
    sourceEl.selectionStart = sourceEl.selectionEnd = ls + rep.length;
  } else {
    const rep = before + insert + after;
    sourceEl.value = text.slice(0,start) + rep + text.slice(end);
    sourceEl.selectionStart = start + before.length;
    sourceEl.selectionEnd = start + before.length + insert.length;
  }
  sourceEl.dispatchEvent(new Event('input'));
}

// Keyboard shortcuts
sourceEl.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key === 'b') { e.preventDefault(); insertFormat('bold'); }
  if ((e.ctrlKey||e.metaKey) && e.key === 'i') { e.preventDefault(); insertFormat('italic'); }
  if ((e.ctrlKey||e.metaKey) && e.key === 'k') { e.preventDefault(); insertFormat('link'); }
  if ((e.ctrlKey||e.metaKey) && e.key === 's') { e.preventDefault(); autoSave().then(()=>showToast('已保存')); }
  if (e.key === 'Tab') { e.preventDefault(); const s=sourceEl.selectionStart; sourceEl.value=sourceEl.value.slice(0,s)+'  '+sourceEl.value.slice(sourceEl.selectionEnd); sourceEl.selectionStart=sourceEl.selectionEnd=s+2; sourceEl.dispatchEvent(new Event('input')); }
});

async function exportFolderZip(folderPath) {
  $('ctxMenu').style.display = 'none';
  const all = await store.getAll();
  const files = all.filter(f => !f.isFolder && f.path.startsWith(folderPath + '/'));
  if (!files.length) { showToast('文件夹为空'); return; }
  const zip = new JSZip();
  const folderName = folderPath.split('/').pop();
  for (const f of files) {
    const rel = f.path.slice(folderPath.length + 1);
    zip.file(rel, f.content || '');
  }
  const blob = await zip.generateAsync({ type: 'blob' });
  downloadBlob(blob, folderName + '.zip', 'application/zip', true);
  showToast('已导出 ' + folderName + '.zip');
}

async function exportAllZip() {
  const all = await store.getAll();
  const files = all.filter(f => !f.isFolder);
  if (!files.length) { showToast('没有文件可导出'); return; }
  const zip = new JSZip();
  for (const f of files) { zip.file(f.path.slice(1), f.content || ''); }
  const blob = await zip.generateAsync({ type: 'blob' });
  downloadBlob(blob, 'md-editor-export.zip', 'application/zip', true);
  showToast('已导出全部文件');
}

function downloadBlob(content, filename, mime, isBlob) {
  const blob = isBlob ? content : new Blob([content], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// ============================================================
// Modal / Prompt
// ============================================================
function showPrompt(title, label, defaultVal) {
  return new Promise(resolve => {
    const overlay = $('modalOverlay');
    const modal = $('modal');
    modal.innerHTML = `<h3>${title}</h3><label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">${label}</label><input type="text" id="promptInput" value="${defaultVal||''}"><div class="modal-actions"><button class="btn" id="promptCancel">取消</button><button class="btn btn-primary" id="promptOk">确定</button></div>`;
    overlay.classList.add('show');
    const input = $('promptInput');
    input.focus(); input.select();
    const close = (val) => { overlay.classList.remove('show'); resolve(val); };
    $('promptCancel').onclick = () => close(null);
    $('promptOk').onclick = () => close(input.value.trim());
    input.onkeydown = e => { if (e.key === 'Enter') close(input.value.trim()); if (e.key === 'Escape') close(null); };
  });
}

// ============================================================
// Toast
// ============================================================
function showToast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

async function initDefaultDocs() {

  if (empty) {
    await store.put({ path: '/使用指南.md', name: '使用指南.md', content: GUIDE_CONTENT, isFolder: false, parentPath: '/', createdAt: Date.now(), updatedAt: Date.now() });

}

// ============================================================
// Init
// ============================================================
(async function init() {
  await store.open();
  await initDefaultDocs();
  await renderFileTree();
  // Restore last opened file
  const lastPath = localStorage.getItem('md-last-file');
  if (lastPath) {
    const item = await store.get(lastPath);
    if (item && !item.isFolder) openFile(lastPath);
  }
})();

// Save last file on unload
window.addEventListener('beforeunload', () => {
  if (currentFilePath) {
    autoSave();
    localStorage.setItem('md-last-file', currentFilePath);
  }
});
